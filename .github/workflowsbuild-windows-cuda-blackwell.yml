name: Build Windows CUDA 13.1 (Blackwell)

on:
  push:
    branches:
      - feature/turboquant-kv-cache
  pull_request:
    branches:
      - feature/turboquant-kv-cache
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup CUDA 13.1
        uses: Jimver/cuda-toolkit@v0.2.14
        with:
          cuda: '13.1.0'
          method: 'network'
          sub-packages: '["cudart", "curand_dev", "nvcc", "cublas_dev", "cusparse_dev"]'

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.28.x'

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Configure CMake (CUDA 13.1 - Blackwell)
        shell: cmd
        run: |
          cmake -B build ^
            -G Ninja ^
            -DGGML_CUDA=ON ^
            -DCMAKE_CUDA_ARCHITECTURES="100" ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DBUILD_SHARED_LIBS=ON

      - name: Build
        shell: cmd
        run: |
          cmake --build build --config Release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llama-cpp-windows-cuda-13.1-blackwell
          path: build/bin/
          retention-days: 30

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/bin/**/*
          draft: false
          prerelease: false
