name: Build Windows Latest CUDA 13 Blackwell

on:
  workflow_dispatch:
  push:
    branches:
      - feature/turboquant-kv-cache
    paths:
      - '.github/workflows/build-windows-cuda-13-blackwell.yml'
      - '**/*.cpp'
      - '**/*.h'
      - '**/*.cu'
      - '**/CMakeLists.txt'

jobs:
  windows-latest-cuda-13-blackwell:
    runs-on: windows-latest
    
    strategy:
      matrix:
        cuda: ['13.3']
    
    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Install ccache
        uses: ggml-org/ccache-action@v1.2.21
        with:
          key: windows-latest-cuda-13-blackwell
          variant: ccache
          evict-old-files: 1d

      - name: Install CUDA Toolkit 13.3
        uses: ./.github/actions/windows-setup-cuda
        with:
          cuda_version: '13.3'

      - name: Install Ninja
        run: choco install ninja

      - name: Build (Blackwell - Compute Capability 10.0)
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake -S . -B build -G "Ninja Multi-Config" ^
            -DLLAMA_BUILD_SERVER=ON ^
            -DLLAMA_BUILD_BORINGSSL=ON ^
            -DGGML_NATIVE=OFF ^
            -DGGML_BACKEND_DL=ON ^
            -DGGML_CPU_ALL_VARIANTS=ON ^
            -DGGML_CUDA=ON ^
            -DCMAKE_CUDA_ARCHITECTURES="100" ^
            -DGGML_RPC=ON
          set /A NINJA_JOBS=%NUMBER_OF_PROCESSORS%-1
          cmake --build build --config Release -j %NINJA_JOBS%

      - name: Upload Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: llama-cpp-turboquant-windows-cuda-13-blackwell
          path: build/bin/Release/
          retention-days: 30
